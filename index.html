<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DARK-ia</title>

  <style>
    body {
      margin: 0;
      background: #0b0b0f;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px;
      background: #15151c;
      font-size: 25px;
      font-weight: bold;
      text-align: center;
    }

    #chat {
      height: calc(100vh - 150px);
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      padding: 12px 16px;
      margin: 10px 0;
      border-radius: 15px;
      max-width: 70%;
    }

    .user {
      background: #333;
      margin-left: auto;
    }

    .ai {
      background: #1d1d25;
    }

    form {
      position: fixed;
      bottom: 0;
      width: 100%;
      display: flex;
      padding: 15px;
      box-sizing: border-box;
      background: #15151c;
    }

    input {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      margin-left: 10px;
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <header>🌑 DARK-ia</header>

  <div id="chat">
    <div class="message ai">
      Salut 👋 Je suis DARK-ia.
    </div>
  </div>

  <form id="form">
    <input id="input" placeholder="Écris ton message..." autocomplete="off">
    <button type="submit">Envoyer</button>
  </form>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const chat = document.getElementById("chat");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const text = input.value.trim();
      if (!text) return;

      const user = document.createElement("div");
      user.className = "message user";
      user.textContent = text;
      chat.appendChild(user);

      input.value = "";

      setTimeout(function() {
        const answer = document.createElement("div");
        answer.className = "message ai";
        answer.textContent = "J’ai reçu ton message 😈";
        chat.appendChild(answer);
        chat.scrollTop = chat.scrollHeight;
      }, 500);
    });
  </script>

</body>
</html>
